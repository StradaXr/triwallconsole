<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tri-Wall Console isn't running</title>
<link rel="stylesheet" href="/app.css">
<style>
  .down { position: relative; z-index: 1; max-width: 560px; margin: 14vh auto 0; padding: 0 16px; display: grid; gap: 16px; }
  .down h1 { font-size: 28px; }
  .down p { color: var(--muted); margin: 0; }
  .down .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
</style>
</head>
<body>
<div class="vignette"></div>
<main class="down">
  <span class="logo" aria-hidden="true"><i></i><i></i><i></i></span>
  <h1>The Tri-Wall Console isn't running yet.</h1>
  <p>Double-click <b>Launch Tri-Wall Console.bat</b> in the triwallconsole folder (one level up from the studio),
    wait for it to open, then press <b>Try again</b>.</p>
  <p>Looking for it at <code>__CONSOLE_URL__</code>.</p>
  <div class="row">
    <a class="btn primary" href="/console">Try again</a>
    <a class="btn ghost" href="/">← Back to Tri-Wall Studio</a>
  </div>
</main>
</body>
</html>
